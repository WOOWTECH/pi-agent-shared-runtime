name: deployment-verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.0.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Install locked plugin dependencies without host side effects
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Audit plugin production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install pinned test host peers
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@1.0.0 typebox@1.3.3
      - run: node --test --test-timeout=30000 tests/*.test.mjs
      - run: npm pack --dry-run --ignore-scripts
